name: Director Skill Validation

on:
  push:
    paths:
      - "intelligence/**"
      - "schemas/**"
      - "tests/test-director-skill.ts"
      - "package.json"
      - "rendering/**"
      - "cli.ts"
      - ".github/workflows/director-check.yml"
  pull_request:
    paths:
      - "intelligence/**"
      - "schemas/**"
      - "tests/test-director-skill.ts"
      - "package.json"
      - "rendering/**"
      - "cli.ts"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:director
