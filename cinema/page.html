<!doctype html>
<html><head><meta charset="utf-8"><title>AI Agent — 30s</title>
<style>
:root{--bg:#0A0F1F;--panel:#111936;--panel2:#162043;--line:#27345F;--ink:#EEF3FF;--mut:#8D9AC0;--cy:#4DE1FF;--vi:#8B7BFF;--ok:#4ADE80;--warn:#FFB454;--bad:#FF6B7A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;background:var(--bg);overflow:hidden}
body{font-family:'Inter',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(1200px 700px at 70% 20%,#16224A 0%,rgba(10,15,31,0) 70%),radial-gradient(900px 600px at 10% 90%,#1A1647 0%,rgba(10,15,31,0) 70%),var(--bg)}
#grid{position:absolute;left:-120px;top:-120px;width:2160px;height:1320px;background-image:linear-gradient(rgba(77,225,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(77,225,255,.055) 1px,transparent 1px);background-size:80px 80px}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.5) 100%);pointer-events:none;z-index:50}
.sc{position:absolute;inset:0;opacity:0;transform-origin:50% 50%}
.eye{position:absolute;left:120px;top:84px;font-size:26px;font-weight:700;letter-spacing:.22em;color:var(--mut);display:flex;gap:18px;align-items:center}
.eye b{color:var(--cy);font-weight:800}
.eye i{display:block;width:56px;height:2px;background:var(--line)}
.abs{position:absolute}
.panel{position:absolute;background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:28px;box-shadow:0 30px 60px rgba(0,0,0,.45)}
.tag{display:inline-block;font-size:24px;font-weight:800;letter-spacing:.2em;padding:10px 22px;border-radius:999px;border:2px solid var(--line);color:var(--mut)}
.tag.cy{color:var(--cy);border-color:rgba(77,225,255,.5);background:rgba(77,225,255,.08)}
.mono{font-family:'DejaVu Sans Mono',monospace;font-weight:700}
.bubble{position:absolute;padding:22px 30px;border-radius:26px;font-size:32px;font-weight:600;line-height:1.3}
.node{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;border-radius:22px;border:2px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:0 18px 40px rgba(0,0,0,.4)}
.big{font-weight:800;letter-spacing:-.03em;line-height:1.02}
svg{position:absolute;left:0;top:0;overflow:visible}
.row{position:absolute;display:flex;align-items:center;gap:22px;font-size:34px;font-weight:700}
.chk{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.line{height:16px;border-radius:8px;background:#27345F}
</style></head><body>
<div id="stage"><div id="grid"></div><div id="cam"></div><div id="vig"></div></div>
<script src="gsap.min.js"></script>
<script>
const TIMING = /*TIMING*/null;
/* ---------- word clock ---------- */
const WORDS = TIMING.words.map(w => ({ w: w.w.toLowerCase().replace(/[^a-z']/g, ''), s: w.start, e: w.end }));
const A = (word, n = 0) => { let k = 0; for (const x of WORDS) if (x.w === word) { if (k === n) return x.s; k++; } throw new Error('word not found: ' + word + '#' + n); };
const TOTAL = 30.0, FPS = 60;
const CUES = [];
const cue = (t, kind, gain = 1) => CUES.push({ t: +t.toFixed(3), kind, gain });

/* ---------- helpers ---------- */
const $ = (h, parent, style, cls) => { const d = document.createElement('div'); d.className = (cls ? cls + ' ' : '') + 'abs'; if (style) d.style.cssText = style; d.innerHTML = h || ''; (parent || document.getElementById('cam')).appendChild(d); return d; };
const NS = 'http://www.w3.org/2000/svg';
const svg = (parent) => { const s = document.createElementNS(NS, 'svg'); s.setAttribute('width', 1920); s.setAttribute('height', 1080); s.setAttribute('viewBox', '0 0 1920 1080'); parent.appendChild(s); return s; };
const path = (s, d, color, w, extra = '') => { const p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); p.setAttribute('fill', 'none'); p.setAttribute('stroke', color); p.setAttribute('stroke-width', w); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('stroke-linejoin', 'round'); if (extra) p.setAttribute('style', extra); s.appendChild(p); const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; p._L = L; return p; };
const draw = (tl, p, t, dur, ease = 'power2.inOut') => tl.to(p, { strokeDashoffset: 0, duration: dur, ease }, t);
const IN = (tl, e, t, o = {}) => tl.fromTo(e, { opacity: 0, y: o.y ?? 36, x: o.x ?? 0, scale: o.s ?? 0.96 }, { opacity: 1, y: 0, x: 0, scale: 1, duration: o.d ?? 0.55, ease: o.ease ?? 'power3.out' }, t);
const OUT = (tl, e, t, d = 0.3) => tl.to(e, { opacity: 0, duration: d, ease: 'power1.in' }, t);
const typeTo = (tl, el, str, t, dur) => { const o = { n: 0 }; tl.to(o, { n: str.length, duration: dur, ease: 'none', onUpdate: () => { el.textContent = str.slice(0, Math.round(o.n)); } }, t); };
const CHECK = '<svg width="26" height="26" viewBox="0 0 26 26" style="position:static"><path d="M4 14l6 6L22 6" fill="none" stroke="#06101f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CROSS = '<svg width="26" height="26" viewBox="0 0 26 26" style="position:static"><path d="M6 6l14 14M20 6L6 20" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>';
const eyebrow = (sc, n, label) => $(`<b>${n}</b><i></i><span>${label}</span>`, sc, '', 'eye');
const mk = id => { const s = document.createElement('section'); s.className = 'sc'; s.id = id; document.getElementById('cam').appendChild(s); return s; };
const tl = gsap.timeline({ paused: true });
window.__tl = tl;

/* ---------- scene windows ---------- */
const S = [0, 3.12, 5.90, 8.72, 12.74, 17.9, 22.16, TOTAL];
const sc = [0, 1, 2, 3, 4, 5, 6].map(i => mk('s' + i));
sc.forEach((s, i) => {
  const a = S[i], b = S[i + 1], last = i === sc.length - 1;
  tl.set(s, { opacity: 0 }, 0);
  tl.fromTo(s, { opacity: 0, scale: 0.975 }, { opacity: 1, scale: 1, duration: i === 0 ? 0.01 : 0.5, ease: 'power3.out' }, a - (i === 0 ? 0 : 0.12));
  tl.fromTo(s, { scale: 1.0 }, { scale: 1.02, duration: b - a + 0.2, ease: 'none', immediateRender: false }, a + 0.5);
  if (!last) tl.to(s, { opacity: 0, duration: 0.28, ease: 'power1.in' }, b - 0.1);
  if (i > 0) cue(a - 0.1, 'whoosh', 0.6);
});
tl.fromTo('#grid', { x: 0, y: 0 }, { x: -160, y: -80, duration: TOTAL, ease: 'none' }, 0);

/* ===== S0: the old way — a search box ===== */
{
  const s = sc[0]; eyebrow(s, '01', 'THE OLD WAY');
  const box = $('', s, 'left:260px;top:330px;width:1400px;height:132px;border-radius:66px;background:linear-gradient(180deg,#18224A,#111936);border:2px solid var(--line);box-shadow:0 30px 70px rgba(0,0,0,.5)');
  $(`<svg width="54" height="54" viewBox="0 0 54 54" style="position:static"><circle cx="22" cy="22" r="14" fill="none" stroke="#8D9AC0" stroke-width="5"/><path d="M33 33l14 14" stroke="#8D9AC0" stroke-width="5" stroke-linecap="round"/></svg>`, s, 'left:318px;top:369px;width:54px;height:54px');
  const q = $('', s, 'left:408px;top:360px;font-size:54px;font-weight:600;white-space:nowrap;height:72px;line-height:72px'); const cur = $('', s, 'left:408px;top:366px;width:4px;height:60px;background:var(--cy)');
  const ans = $('', s, 'left:260px;top:530px;width:1400px;height:340px;padding:46px 56px', 'panel');
  $('<span class="tag">ANSWER</span><span style="margin-left:22px;font-size:28px;font-weight:700;color:var(--mut)">text only — you still do the work</span>', ans, 'position:relative;margin-bottom:34px');
  const ls = [1160, 1230, 920, 1080].map((w, i) => $('', ans, `position:relative;margin-top:${i ? 26 : 34}px;width:${w}px`, 'line'));
  const t0 = A('most') + 0.15, t1 = A('search');
  IN(tl, box, 0.05, { d: 0.6 }); IN(tl, q.previousElementSibling, 0.1);
  tl.fromTo(cur, { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.25);
  typeTo(tl, q, 'write my email for me', 0.3, 1.5); tl.to(cur, { x: 0, duration: 0.01 }, 0.3);
  const pos = { x: 0 }; tl.to(pos, { x: 1, duration: 1.5, ease: 'none', onUpdate: () => { cur.style.left = (408 + q.getBoundingClientRect().width + 6) + 'px'; } }, 0.3);
  for (let k = 0; k < 22; k++) cue(0.3 + k * 0.068, 'tick', 0.25);
  IN(tl, ans, 1.95, { y: 50, d: 0.6 }); cue(1.95, 'soft', 0.7);
  ls.forEach((l, i) => tl.fromTo(l, { scaleX: 0, transformOrigin: '0 50%' }, { scaleX: 1, duration: 0.45, ease: 'power2.out' }, 2.15 + i * 0.12));
  tl.to(box, { borderColor: '#4DE1FF', boxShadow: '0 0 0 6px rgba(77,225,255,.18),0 30px 70px rgba(0,0,0,.5)', duration: 0.3 }, t1);
}

/* ===== S1: chatbot vs agent ===== */
{
  const s = sc[1]; eyebrow(s, '02', 'CHATBOT vs AGENT');
  const L = $('', s, 'left:96px;top:170px;width:820px;height:600px', 'panel'), R = $('', s, 'left:1004px;top:170px;width:820px;height:600px;border-color:rgba(77,225,255,.5)', 'panel');
  $('<span class="tag">CHATBOT</span>', L, 'position:absolute;left:36px;top:30px'); $('<span class="tag cy">AGENT</span>', R, 'position:absolute;left:36px;top:30px');
  const u = $('Book me a flight to Dubai', L, 'right:36px;top:130px;background:#27345F;max-width:560px', 'bubble');
  const r = $('Here are some tips for booking flights: compare prices, check dates, read the fine print…', L, 'left:36px;top:260px;width:640px;background:#1B2550;color:#B8C3E6', 'bubble');
  const bar = $('', R, 'position:absolute;left:36px;right:36px;bottom:44px;height:14px;border-radius:7px;background:#1B2550'), fill = $('', bar, 'height:14px;width:0;border-radius:7px;background:linear-gradient(90deg,#4DE1FF,#8B7BFF)');
  const tasks = ['Search live flights', 'Compare 14 prices', 'Book the best seat', 'Email the receipt'], rows = [], chks = [];
  tasks.forEach((tx, i) => { const rw = $(`<div class="chk"></div><span>${tx}</span>`, R, `left:36px;top:${125 + i * 92}px;width:740px`, 'row'); rows.push(rw); chks.push(rw.firstChild); });
  const wA = $('answers.', s, 'left:120px;top:830px;font-size:132px;color:#6C79A3', 'big'), wB = $('acts.', s, 'left:1004px;top:830px;font-size:132px;color:var(--cy)', 'big');
  const ta = A('answers'), tb = A('acts');
  IN(tl, L, 0.0 + S[1] + 0.0, { d: 0.5 }); IN(tl, R, S[1] + 0.0, { d: 0.5 });
  IN(tl, u, ta - 0.9, { y: 20 }); IN(tl, r, ta - 0.45, { y: 20 }); cue(ta - 0.9, 'pop', 0.5); cue(ta - 0.45, 'pop', 0.5);
  IN(tl, wA, ta - 0.05, { y: 50, d: 0.5 });
  rows.forEach((rw, i) => { const t = tb - 0.1 + i * 0.28; IN(tl, rw, t, { x: 40, y: 0, d: 0.4 }); tl.to(chks[i], { backgroundColor: '#4ADE80', borderColor: '#4ADE80', duration: 0.2 }, t + 0.45); tl.call(() => { chks[i].innerHTML = CHECK; }, null, t + 0.45); tl.to(fill, { width: ((i + 1) / 4 * 100) + '%', duration: 0.3, ease: 'power2.out' }, t + 0.45); cue(t + 0.45, 'click', 0.55); });
  IN(tl, wB, tb - 0.02, { y: 50, d: 0.5 }); cue(tb, 'hit', 0.7);
  tl.to(wA, { opacity: 0.4, duration: 0.4 }, tb + 0.4);
}

/* ===== S2: goal -> steps ===== */
{
  const s = sc[2]; eyebrow(s, '03', 'GOAL → STEPS'); const sv = svg(s);
  const g = $('<div style="font-size:24px;letter-spacing:.2em;color:var(--cy);font-weight:800;margin-bottom:14px">GOAL</div><div style="font-size:50px;line-height:1.1" class="big">Launch my newsletter</div>', s, 'left:96px;top:370px;width:500px;height:300px;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 44px;text-align:left;border-color:rgba(77,225,255,.6);box-shadow:0 0 0 8px rgba(77,225,255,.07),0 30px 70px rgba(0,0,0,.5)', 'node');
  const steps = ['Research topics', 'Write the draft', 'Design the layout', 'Schedule the send'], ys = [180, 380, 580, 780], els = [], ps = [];
  steps.forEach((tx, i) => { const y = ys[i]; ps.push(path(sv, `M600 520 C 800 520, 760 ${y + 50}, 1000 ${y + 50}`, '#4DE1FF', 4, 'opacity:.8')); els.push($(`<span class="mono" style="color:var(--cy);margin-right:22px;font-size:34px">0${i + 1}</span><span style="font-size:42px">${tx}</span>`, s, `left:1000px;top:${y}px;width:760px;height:100px;justify-content:flex-start;padding:0 36px`, 'node')); });
  const tg = A('goal'), tbk = A('breaks'), tst = A('steps');
  IN(tl, g, tg - 0.2, { x: -30, y: 0, d: 0.6 }); cue(tg - 0.2, 'soft', 0.7);
  ps.forEach((p, i) => { const t = tbk - 0.1 + i * 0.17; draw(tl, p, t, 0.55); IN(tl, els[i], t + 0.35, { x: 40, y: 0, d: 0.45 }); cue(t + 0.3, 'tick', 0.5); });
  tl.to(els[3], { borderColor: 'rgba(77,225,255,.6)', duration: 0.3 }, tst);
}

/* ===== S3: tools ===== */
{
  const s = sc[3]; eyebrow(s, '04', 'THE RIGHT TOOLS'); s.style.perspective = '1800px';
  const mkCard = (x, title, color) => { const c = $('', s, `left:${x}px;top:180px;width:540px;height:680px;transform-style:preserve-3d`, 'panel'); $(`<span style="width:16px;height:16px;border-radius:50%;background:${color};display:inline-block"></span><span style="font-size:30px;font-weight:800;letter-spacing:.14em;margin-left:16px">${title}</span>`, c, 'position:absolute;left:36px;top:34px;display:flex;align-items:center'); return c; };
  const c1 = mkCard(96, 'WEB SEARCH', '#4DE1FF'), c2 = mkCard(690, 'READ FILE', '#FFB454'), c3 = mkCard(1284, 'WRITE CODE', '#8B7BFF');
  const sb = $('', c1, 'left:36px;top:110px;right:36px;height:84px;border-radius:42px;background:#0C1330;border:2px solid var(--line);padding:0 30px;line-height:80px;font-size:32px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden');
  const rs = [0, 1, 2].map(i => $(`<div style="width:${[78, 64, 70][i]}%;height:16px;border-radius:8px;background:${i ? '#27345F' : '#4DE1FF'};margin-bottom:16px"></div><div class="line" style="width:92%;margin-bottom:12px"></div><div class="line" style="width:58%"></div>`, c1, `left:36px;top:${240 + i * 150}px;right:36px;position:absolute`));
  const docl = [90, 100, 76, 96, 64, 88, 100, 70].map((w, i) => $('', c2, `left:46px;top:${124 + i * 56}px;width:${w * 4.4}px;position:absolute`, 'line'));
  const hl = $('', c2, 'left:30px;top:228px;width:480px;height:62px;border-radius:14px;background:rgba(255,180,84,.2);border:2px solid #FFB454;position:absolute');
  const code = $('', c3, 'left:36px;top:108px;right:36px;bottom:36px;font-size:30px;line-height:1.55;white-space:pre;color:#C7D0F2', 'mono');
  const CODE = ['<span style="color:#8B7BFF">def</span> run(goal):', '  steps = plan(goal)', '  <span style="color:#8B7BFF">for</span> s <span style="color:#8B7BFF">in</span> steps:', '    out = use_tool(s)', '    <span style="color:#8B7BFF">if</span> check(out):', '      <span style="color:#4ADE80">continue</span>', '    retry(s)'];
  const tS = A('search', 1), tR = A('read'), tW = A('write');
  [[c1, S[3] + .15, -12], [c2, tR - .35, 0], [c3, tW - .35, 12]].forEach(([c, t, rot]) => { tl.fromTo(c, { opacity: 0, y: 70, rotateY: rot * 2.2, scale: .94 }, { opacity: 1, y: 0, rotateY: rot, scale: 1, duration: .75, ease: 'power3.out' }, t); cue(t + .05, 'pop', .6); tl.to(c, { y: -10, duration: 1.6, ease: 'sine.inOut', yoyo: true, repeat: 1 }, t + .8); });
  typeTo(tl, sb, 'agent tool pricing 2026', tS - 0.1, 0.9); rs.forEach((r, i) => IN(tl, r, tS + 0.9 + i * 0.12, { y: 18, d: 0.4 }));
  docl.forEach((l, i) => tl.fromTo(l, { scaleX: 0, transformOrigin: '0 50%' }, { scaleX: 1, duration: .35, ease: 'power2.out' }, tR - 0.2 + i * 0.05));
  tl.fromTo(hl, { opacity: 0, scaleX: .2, transformOrigin: '0 50%' }, { opacity: 1, scaleX: 1, duration: .5, ease: 'power3.out' }, tR + 0.35); tl.to(hl, { y: 112, duration: .7, ease: 'power2.inOut' }, tR + 1.1); cue(tR + .4, 'click', .6);
  const cl = { n: 0 }; tl.to(cl, { n: CODE.length, duration: 1.5, ease: 'none', onUpdate: () => { code.innerHTML = CODE.slice(0, Math.floor(cl.n)).join('\n'); } }, tW + 0.0);
  for (let k = 0; k < 7; k++) cue(tW + k * 0.21, 'tick', .3);
}

/* ===== S4: check and retry ===== */
{
  const s = sc[4]; eyebrow(s, '05', 'CHECK → RETRY'); const sv = svg(s);
  const mkN = (x, y, w, h, label, sub) => $(`<div><div style="font-size:42px">${label}</div>${sub ? `<div style="font-size:26px;color:var(--mut);margin-top:8px;font-weight:600">${sub}</div>` : ''}</div>`, s, `left:${x}px;top:${y}px;width:${w}px;height:${h}px`, 'node');
  const mkD = (x, y, id) => { const d = $('', s, `left:${x}px;top:${y}px;width:150px;height:150px;border-radius:30px;transform:rotate(45deg);border:3px solid var(--line);background:#0C1330;display:flex;align-items:center;justify-content:center`); d.id = id; const ic = $('', s, `left:${x}px;top:${y}px;width:150px;height:150px;display:flex;align-items:center;justify-content:center`); return [d, ic]; };
  const A1 = mkN(96, 330, 300, 150, 'Step 1', 'draft email'), [D1, I1] = mkD(470, 330, 'd1'), B1 = mkN(760, 330, 300, 150, 'Step 2', 'send invoice'), [D2, I2] = mkD(1134, 330, 'd2');
  const B2 = mkN(760, 690, 300, 150, 'New path', 'resend via API'), [D3, I3] = mkD(1134, 690, 'd3'), DONE = mkN(1540, 480, 280, 170, 'Done', 'delivered');
  DONE.style.borderColor = '#4ADE80'; DONE.style.boxShadow = '0 0 0 8px rgba(74,222,128,.1),0 30px 60px rgba(0,0,0,.45)';
  const p1 = path(sv, 'M396 405 H 470', '#4DE1FF', 4), p2 = path(sv, 'M620 405 H 760', '#4DE1FF', 4), p3 = path(sv, 'M1060 405 H 1134', '#4DE1FF', 4);
  const p4 = path(sv, 'M1285 345 C 1380 345, 1380 345, 1400 345', '#FF6B7A', 4, 'stroke-dasharray:10 12'), p5 = path(sv, 'M1209 480 C 1209 590, 1060 610, 1000 690', '#FFB454', 5), p6 = path(sv, 'M1060 765 H 1134', '#FFB454', 5), p7 = path(sv, 'M1285 765 C 1420 765, 1440 610, 1540 600', '#4ADE80', 5);
  p4.style.strokeDasharray = 'none'; p4.style.strokeDashoffset = 0; p4.setAttribute('d', 'M0 0'); p4.style.opacity = 0;
  const good = (ic, d, t) => { tl.to(d, { borderColor: '#4ADE80', backgroundColor: '#123324', duration: .25 }, t); tl.call(() => { ic.innerHTML = `<div style="width:68px;height:68px;border-radius:50%;background:#4ADE80;display:flex;align-items:center;justify-content:center">${CHECK}</div>`; }, null, t); tl.fromTo(ic, { scale: .4 }, { scale: 1, duration: .35, ease: 'back.out(3)' }, t); cue(t, 'click', .6); };
  const tCh = A('checks'), tF = A('fails'), tDp = A('different'), tPa = A('path');
  [D1, D2, D3].forEach(d => tl.set(d, { rotate: 45 }, 0));
  [A1, I1, B1].forEach((e, i) => IN(tl, e, S[4] + 0.05 + i * 0.12, { y: 20, d: .45 }));
  draw(tl, p1, S[4] + .3, .3);
  tl.fromTo(D1, { opacity: 0 }, { opacity: 1, duration: .4 }, tCh - .35); good(I1, D1, tCh + .1);
  draw(tl, p2, tCh + .45, .35);
  tl.fromTo(D2, { opacity: 0 }, { opacity: 1, duration: .4 }, tCh + .8); draw(tl, p3, tCh + .75, .25);
  tl.to(D2, { borderColor: '#FF6B7A', backgroundColor: '#3A1620', duration: .15 }, tF);
  tl.call(() => { I2.innerHTML = `<div style="width:68px;height:68px;border-radius:50%;background:#FF6B7A;display:flex;align-items:center;justify-content:center">${CROSS}</div>`; }, null, tF);
  tl.fromTo(I2, { scale: .4, opacity: 0 }, { scale: 1, opacity: 1, duration: .35, ease: 'back.out(3)' }, tF); cue(tF, 'fail', .8);
  tl.fromTo(B1, { x: 0 }, { keyframes: { x: [0, -10, 10, -6, 6, 0] }, duration: .4 }, tF);
  draw(tl, p5, tF + .05, .5); cue(tF + .05, 'whoosh', .5); IN(tl, B2, tF + .3, { y: 20, d: .45 }); tl.fromTo(D3, { opacity: 0 }, { opacity: 1, duration: .35 }, tF + .6);
  draw(tl, p6, tDp - .05, .3); good(I3, D3, tDp + .25); draw(tl, p7, tDp + .4, .45); IN(tl, DONE, tPa + .1, { y: 20, d: .45 }); cue(tPa + .1, 'hit', .7);
}

/* ===== S5: the loop ===== */
{
  const s = sc[5]; eyebrow(s, '06', 'THE LOOP'); const sv = svg(s); const cx = 960, cy = 570, R = 330;
  const ring = path(sv, `M${cx} ${cy - R} A ${R} ${R} 0 1 1 ${cx - 0.01} ${cy - R}`, 'rgba(77,225,255,.35)', 4);
  const names = ['Plan', 'Act', 'Check', 'Repeat'], cols = ['#4DE1FF', '#8B7BFF', '#4ADE80', '#FFB454'], nodes = [];
  names.forEach((n, i) => { const a = -Math.PI / 2 + i * Math.PI / 2, x = cx + R * Math.cos(a), y = cy + R * Math.sin(a); nodes.push($(n, s, `left:${x - 100}px;top:${y - 100}px;width:200px;height:200px;z-index:3;border-radius:50%;font-size:40px;border-color:${cols[i]};box-shadow:0 0 0 8px ${cols[i]}22,0 24px 50px rgba(0,0,0,.45)`, 'node')); });
  const hub = $('<div id="hubA" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:34px;letter-spacing:.14em;color:var(--mut);line-height:1.35">LANGUAGE<br>MODEL</div><div id="hubB" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:44px;letter-spacing:.12em;color:#06101f;opacity:0;background:linear-gradient(135deg,#4DE1FF,#8B7BFF);border-radius:50%">WORKER</div>', s, `left:${cx - 170}px;top:${cy - 170}px;width:340px;height:340px;border-radius:50%;font-weight:800;overflow:hidden`, 'node');
  const dot = $('', s, `left:${cx - 14}px;top:${cy - R - 14}px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 0 0 10px rgba(77,225,255,.25),0 0 40px #4DE1FF;z-index:1`);
  const tP = A('plan'), tA = A('act'), tC = A('check'), tRp = A('repeat'), tT = A('turns'), tW = A('worker');
  tl.fromTo(ring, { strokeDashoffset: ring._L }, { strokeDashoffset: 0, duration: 2.4, ease: 'power1.inOut' }, S[5] + .1);
  IN(tl, hub, S[5] + .1, { s: .8, y: 0, d: .6 });
  [tP, tA, tC, tRp].forEach((t, i) => { IN(tl, nodes[i], Math.max(t - .05, S[5] + .02), { s: .5, y: 0, d: .5, ease: 'back.out(2)' }); cue(t, 'pop', .7); });
  const ob = { a: 0 }; tl.fromTo(dot, { opacity: 0 }, { opacity: 1, duration: .2 }, tP);
  tl.to(ob, { a: Math.PI * 2 * 1.25, duration: tRp + 1.0 - tP, ease: 'none', onUpdate: () => { const a = -Math.PI / 2 + ob.a; dot.style.left = (cx + R * Math.cos(a) - 14) + 'px'; dot.style.top = (cy + R * Math.sin(a) - 14) + 'px'; } }, tP);
  tl.to('#hubA', { opacity: 0, duration: .3 }, tW - .4); tl.to('#hubB', { opacity: 1, duration: .35 }, tW - .25); cue(tW - .25, 'hit', .8);
  tl.to(hub, { scale: 1.12, duration: .35, ease: 'back.out(3)', yoyo: true, repeat: 1 }, tW - .25);
  nodes.forEach((n, i) => tl.to(n, { y: -6, duration: 1.2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, tW + i * .1));
}

/* ===== S6: the shift ===== */
{
  const s = sc[6]; eyebrow(s, '07', 'THE SHIFT');
  const pr = $('<span class="tag">PROMPT</span><div style="font-size:48px;margin-top:22px;font-weight:600;color:#C7D0F2;line-height:1.2">Write me a report on Q3 sales and email it to the team…</div>', s, 'left:260px;top:210px;width:1400px;height:230px;padding:36px 52px', 'panel');
  const strike = $('', pr, 'position:absolute;left:52px;top:128px;width:0;height:6px;border-radius:3px;background:var(--bad)');
  const outs = [['Report', 'delivered', '#4DE1FF'], ['Meeting', 'booked', '#8B7BFF'], ['Code', 'shipped', '#4ADE80']].map(([a, b, c], i) => { const e = $(`<div style="width:100%;padding:0 40px;display:flex;align-items:center;gap:26px;text-align:left"><div style="width:68px;height:68px;border-radius:50%;background:${c};display:flex;align-items:center;justify-content:center;flex:none">${CHECK}</div><div><div style="font-size:48px">${a}</div><div style="font-size:30px;color:var(--mut);font-weight:600;margin-top:4px">${b}</div></div></div>`, s, `left:${96 + i * 600}px;top:300px;width:560px;height:200px;border-color:${c}88`, 'node'); return e; });
  const l1 = $('From <span style="color:#6C79A3;text-decoration:line-through;text-decoration-thickness:6px;text-decoration-color:rgba(255,107,122,.9)">asking</span>', s, 'left:120px;top:660px;font-size:112px;white-space:nowrap', 'big');
  const arrow = svg(s); const x1 = 120 + l1.offsetWidth + 30; const ap = path(arrow, `M${x1} 721 H ${x1 + 130}`, '#4DE1FF', 9); const ah = path(arrow, `M${x1 + 90} 679 L${x1 + 136} 721 L${x1 + 90} 763`, '#4DE1FF', 9);
  const l2 = $('delegating', s, `left:${x1 + 175}px;top:660px;font-size:112px;color:var(--cy);white-space:nowrap`, 'big');
  const tS = A('stop'), tH = A('handing'), tK = A('asking'), tD = A('delegating');
  IN(tl, pr, S[6] + .1, { d: .6 }); tl.to(strike, { width: 1296, duration: .5, ease: 'power2.inOut' }, tS + .35); cue(tS + .3, 'swipe', .6);
  tl.to(pr, { opacity: 0.0, y: -40, duration: .45, ease: 'power2.in' }, tH - .2);
  outs.forEach((e, i) => { IN(tl, e, tH + .15 + i * .32, { y: 40, d: .5 }); cue(tH + .15 + i * .32, 'click', .6); });
  IN(tl, l1, tK - .3, { y: 40, d: .55 }); cue(tK - .3, 'soft', .6);
  draw(tl, ap, tD - .45, .35); draw(tl, ah, tD - .12, .2); IN(tl, l2, tD - .05, { y: 40, d: .5 }); cue(tD, 'hit', .9);
  tl.to(['#s6 .node'], { y: -8, duration: 1.4, ease: 'sine.inOut', yoyo: true, repeat: 1 }, tD + .2);
  tl.to(l2, { textShadow: '0 0 60px rgba(77,225,255,.65)', duration: .6 }, tD + .1);
}
tl.to('#cam', { opacity: 0, duration: .5, ease: 'power1.in' }, TOTAL - .5);
tl.to({}, { duration: 0.001 }, TOTAL);
window.seek = (f) => { tl.time(f / FPS, false); return true; };

tl.time(0, false);
</script></body></html>
